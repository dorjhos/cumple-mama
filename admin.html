<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Servidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚙️ Panel Admin en Vivo</div>
        <nav>
            <a href="index.html">Ver Sitio Principal 🌸</a>
        </nav>
    </header>

    <div class="main-container">
        <form id="slide-form">
            <h2>Agregar Diapositiva 🖼️</h2>
            <div class="form-group">
                <label for="slide-title-input">Título:</label>
                <input type="text" id="slide-title-input" placeholder="Ej. Te extrañamos mucho" required>
            </div>
            <div class="form-group">
                <label for="slide-desc-input">Descripción:</label>
                <textarea id="slide-desc-input" rows="3" placeholder="Escribe un mensaje bonito..." required></textarea>
            </div>
            <div class="form-group">
                <label for="slide-image-input">Imagen (opcional):</label>
                <input type="file" id="slide-image-input" accept="image/*">
            </div>
            <button type="submit">Guardar Diapositiva en el Servidor</button>
        </form>

        <form id="message-form">
            <h2>Agregar Mensaje 💌</h2>
            <div class="form-group">
                <label for="message-input">Texto del Mensaje:</label>
                <textarea id="message-input" rows="2" placeholder="Escribe una dedicatoria..." required></textarea>
            </div>
            <button type="submit">Guardar Mensaje en el Servidor</button>
        </form>

        <div class="admin-list">
            <h2>Diapositivas Actuales en el Servidor</h2>
            <div id="admin-slides-list"></div>
        </div>

        <div class="admin-list" style="margin-top: 2rem;">
            <h2>Mensajes Actuales en el Servidor</h2>
            <div id="admin-messages-list"></div>
        </div>
    </div>

    <script>
        let serverData = { slides: [], messages: [] };

        async function fetchServerData() {
            try {
                const response = await fetch('/api/data');
                serverData = await response.json();
                renderAdminLists();
            } catch (error) {
                console.error("Error al obtener datos:", error);
            }
        }

        async function saveServerData() {
            try {
                await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(serverData)
                });
                renderAdminLists();
                alert("¡Guardado exitosamente en el servidor!");
            } catch (error) {
                console.error("Error al guardar:", error);
            }
        }

        function renderAdminLists() {
            const slidesList = document.getElementById('admin-slides-list');
            slidesList.innerHTML = '';
            serverData.slides.forEach((slide, index) => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                const content = document.createElement('span');
                content.innerHTML = `<strong>${slide.title}</strong>${slide.image ? ' 📸' : ''}`;
                const button = document.createElement('button');
                button.className = 'btn-danger';
                button.type = 'button';
                button.textContent = 'Eliminar';
                button.addEventListener('click', () => deleteSlide(index));
                item.append(content, button);
                slidesList.appendChild(item);
            });

            const messagesList = document.getElementById('admin-messages-list');
            messagesList.innerHTML = '';
            serverData.messages.forEach((msg, index) => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <span style="max-width: 70%;">${msg}</span>
                    <button class="btn-danger" onclick="deleteMessage(${index})">Eliminar</button>
                `;
                messagesList.appendChild(item);
            });
        }

        document.getElementById('slide-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('slide-title-input').value;
            const description = document.getElementById('slide-desc-input').value;
            const imageFile = document.getElementById('slide-image-input').files[0];
            let image = null;

            if (imageFile) {
                image = await readImageFile(imageFile);
            }

            serverData.slides.push({ title, description, image });
            await saveServerData();
            document.getElementById('slide-form').reset();
        });

        function readImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({ data: reader.result, name: file.name });
                reader.onerror = () => reject(new Error('Error al leer imagen'));
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('message-input').value;
            serverData.messages.push(text);
            await saveServerData();
            document.getElementById('message-input').reset();
        });

        window.deleteSlide = async function(index) {
            serverData.slides.splice(index, 1);
            await saveServerData();
        };

        window.deleteMessage = async function(index) {
            serverData.messages.splice(index, 1);
            await saveServerData();
        };

        window.onload = fetchServerData;
    </script>
</body>
</html>

        window.onload = renderAdminLists;
    </script>
</body>
</html>
