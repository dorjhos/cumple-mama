<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Servidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-game {
            background: #ff4d6d;
            color: white;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s;
        }
        .btn-game:hover {
            background: #c9184a;
        }
        .empty-notice {
            color: #888;
            font-style: italic;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚙️ Panel Admin en Vivo</div>
        <nav>
            <a href="acepto.html" class="btn-game">🎮 Jugar Interruptores</a>
            <a href="index.html">Ver Sitio Principal 🌸</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- Acceso al juego -->
        <div style="background: white; padding: 1.5rem; border-radius: 16px; margin-bottom: 2rem; border: 1px solid rgba(255,182,193,0.5); display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 style="color: #590d22; margin-bottom: 0.25rem;">🎮 Juego de Interruptores</h3>
                <p style="color: #6c757d; font-size: 0.9rem;">Accede al minijuego interactivo.</p>
            </div>
            <a href="acepto.html" class="btn-game">Iniciar Juego ➔</a>
        </div>

        <form id="slide-form">
            <h2>Agregar Foto a la Presentación 🖼️</h2>
            <div class="form-group">
                <label for="slide-image-input">Seleccionar Imagen:</label>
                <input type="file" id="slide-image-input" accept="image/*" required>
            </div>
            <button type="submit">Guardar Foto en el Servidor</button>
        </form>

        <form id="message-form">
            <h2>Agregar Mensaje Flotante 💌</h2>
            <div class="form-group">
                <label for="message-input">Texto del Mensaje:</label>
                <textarea id="message-input" rows="2" placeholder="Escribe un mensaje para mamá..." required></textarea>
            </div>
            <button type="submit">Guardar Mensaje en el Servidor</button>
        </form>

        <div class="admin-list">
            <h2>Fotos Actuales en el Servidor</h2>
            <div id="admin-slides-list"></div>
        </div>

        <div class="admin-list" style="margin-top: 2rem;">
            <h2>Mensajes Actuales en el Servidor</h2>
            <div id="admin-messages-list"></div>
        </div>
    </div>

    <script>
        let serverData = { slides: [], messages: [] };

        async function fetchServerData() {
            try {
                const response = await fetch('/api/data');
                serverData = await response.json();
                renderAdminLists();
            } catch (error) {
                console.error("Error al obtener datos:", error);
            }
        }

        async function saveServerData() {
            try {
                const response = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(serverData)
                });
                if (response.ok) {
                    renderAdminLists();
                    alert("¡Guardado exitosamente en el servidor!");
                } else {
                    alert("Error al guardar en el servidor.");
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Error de conexión al guardar.");
            }
        }

        function renderAdminLists() {
            const slidesList = document.getElementById('admin-slides-list');
            slidesList.innerHTML = '';
            
            if (serverData.slides.length === 0) {
                slidesList.innerHTML = '<p class="empty-notice">No hay fotos subidas todavía. ¡Agrega la primera arriba!</p>';
            } else {
                serverData.slides.forEach((slide, index) => {
                    const item = document.createElement('div');
                    item.className = 'admin-item';
                    
                    const preview = document.createElement('div');
                    preview.style.display = 'flex';
                    preview.style.alignItems = 'center';
                    preview.style.gap = '10px';
                    
                    const imgSrc = slide.image?.data || (typeof slide.image === 'string' ? slide.image : '');
                    if (imgSrc) {
                        const img = document.createElement('img');
                        img.src = imgSrc;
                        img.style.width = '50px';
                        img.style.height = '50px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '8px';
                        preview.appendChild(img);
                    }
                    
                    const label = document.createElement('span');
                    label.textContent = `Foto #${index + 1}`;
                    preview.appendChild(label);

                    const button = document.createElement('button');
                    button.className = 'btn-danger';
                    button.type = 'button';
                    button.textContent = 'Eliminar';
                    button.addEventListener('click', () => deleteSlide(index));
                    
                    item.append(preview, button);
                    slidesList.appendChild(item);
                });
            }

            const messagesList = document.getElementById('admin-messages-list');
            messagesList.innerHTML = '';

            if (serverData.messages.length === 0) {
                messagesList.innerHTML = '<p class="empty-notice">No hay mensajes guardados. ¡Escribe uno arriba!</p>';
            } else {
                serverData.messages.forEach((msg, index) => {
                    const item = document.createElement('div');
                    item.className = 'admin-item';
                    item.innerHTML = `
                        <span style="max-width: 70%;">${msg}</span>
                        <button class="btn-danger" onclick="deleteMessage(${index})">Eliminar</button>
                    `;
                    messagesList.appendChild(item);
                });
            }
        }

        // Función para comprimir imágenes del lado del cliente antes de subirlas
        function compressAndReadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        const MAX_HEIGHT = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Comprimir a JPEG con calidad 0.8
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        resolve({ data: compressedBase64, name: file.name });
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        document.getElementById('slide-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const imageFile = document.getElementById('slide-image-input').files[0];

            if (imageFile) {
                try {
                    const imageObj = await compressAndReadImage(imageFile);
                    serverData.slides.push({ image: imageObj });
                    await saveServerData();
                    document.getElementById('slide-form').reset();
                } catch (err) {
                    alert("Error al procesar la imagen.");
                    console.error(err);
                }
            }
        });

        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('message-input').value;
            serverData.messages.push(text);
            await saveServerData();
            document.getElementById('message-form').reset();
        });

        window.deleteSlide = async function(index) {
            if (confirm("¿Estás seguro de eliminar esta foto?")) {
                serverData.slides.splice(index, 1);
                await saveServerData();
            }
        };

        window.deleteMessage = async function(index) {
            if (confirm("¿Estás seguro de eliminar este mensaje?")) {
                serverData.messages.splice(index, 1);
                await saveServerData();
            }
        };

        window.onload = fetchServerData;
    </script>
</body>
</html>
