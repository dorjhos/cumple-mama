<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Mamá! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="presentation-page">
    <header>
        <div class="logo">💐 Para la mejor Mamá</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="admin.html">Administración ⚙️</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- Diapositivas / Slideshow -->
        <section class="slider-container" id="slider">
            <div class="slide-media" id="slide-media" hidden>
                <img id="slide-image" alt="Recuerdo especial de mamá">
            </div>
            <p class="presentation-message" id="presentation-message"></p>
        </section>
    </div>

    <script>
        function loadContent() {
            const SLIDE_INTERVAL_MS = 12000;
            const MESSAGE_INTERVAL_MS = 5000;
            const defaultSlides = [
                { title: "¡Feliz Cumpleaños Mamá! 🎉", description: "Hoy celebramos tu vida y todo el amor que nos has dado. ¡Te queremos con todo nuestro corazón!" },
                { title: "Gracias por tanto amor 🌸", description: "Gracias por ser nuestra guía, por tus consejos y por estar siempre presente. ¡Que disfrutes muchísimo tu día!" },
                { title: "Eres nuestro ejemplo 💖", description: "Tu cariño, tu fortaleza y tu alegría hacen que cada día sea más especial. ¡Te admiramos muchísimo!" }
            ];

            const storedSlides = JSON.parse(localStorage.getItem('slides'));
            const hasLegacyDadContent = storedSlides?.some(slide => slide.title?.includes('Papá'));
            const slides = storedSlides && !hasLegacyDadContent ? storedSlides : defaultSlides;
            const messages = JSON.parse(localStorage.getItem('messages')) || [];
            const presentationSlides = slides.map(slide => ({
                type: slide.image ? 'image' : 'text',
                title: slide.title,
                description: slide.description,
                data: slide.image?.data
            }));

            let currentSlide = 0;
            let currentMessage = 0;
            const mediaElem = document.getElementById('slide-media');
            const imageElem = document.getElementById('slide-image');
            const messageElem = document.getElementById('presentation-message');
            const sliderElem = document.getElementById('slider');

            window.showSlide = function(index) {
                if (presentationSlides.length > 0) {
                    currentSlide = (index + presentationSlides.length) % presentationSlides.length;
                    const slide = presentationSlides[currentSlide];
                    if (slide.type === 'image') {
                        imageElem.src = slide.data;
                        mediaElem.hidden = false;
                        sliderElem.style.backgroundImage = `url("${slide.data}")`;
                        sliderElem.classList.add('image-background-slide');
                    } else {
                        imageElem.removeAttribute('src');
                        mediaElem.hidden = true;
                        sliderElem.style.backgroundImage = '';
                        sliderElem.classList.remove('image-background-slide');
                    }
                } else {
                    messageElem.textContent = messages[0] || '';
                }
            }

            showSlide(currentSlide);

            if (presentationSlides.length > 1) {
                setInterval(() => {
                    currentSlide = (currentSlide + 1) % presentationSlides.length;
                    showSlide(currentSlide);
                }, SLIDE_INTERVAL_MS);
            }

            if (messages.length > 0) {
                messageElem.textContent = messages[currentMessage];
                setInterval(() => {
                    currentMessage = (currentMessage + 1) % messages.length;
                    messageElem.textContent = messages[currentMessage];
                }, MESSAGE_INTERVAL_MS);
            }
        }

        window.onload = loadContent;
    </script>
</body>
</html>
