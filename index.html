<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Mamá! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Oculta los textos de título y descripción en la presentación principal */
        .slide-copy {
            display: none !important;
        }

        /* Pantalla de bienvenida / Cortina inicial */
        #welcome-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(89, 13, 34, 0.95) 0%, rgba(201, 24, 74, 0.92) 100%);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: white;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #welcome-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-card {
            max-width: 600px;
            animation: pulse-welcome 2.5s infinite ease-in-out;
        }

        .welcome-card h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .welcome-card p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        .welcome-btn {
            background: #ffffff;
            color: #c9184a;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .welcome-btn:hover {
            transform: scale(1.05);
            background: #fff0f3;
        }

        @keyframes pulse-welcome {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="presentation-page">
    
    <!-- PANTALLA DE BIENVENIDA / CORTINA INICIAL -->
    <div id="welcome-overlay" onclick="iniciarExperiencia()">
        <div class="welcome-card">
            <h1>💐 Para la mejor Mamá 💐</h1>
            <p>Un pequeño detalle hecho con todo el corazón para celebrar tu día especial.<br>Toca en cualquier lugar para comenzar.</p>
            <button class="welcome-btn">✨ Toca para continuar ✨</button>
        </div>
    </div>

    <header>
        <div class="logo">💐 Para la mejor Mamá</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="admin.html">Administración ⚙️</a>
        </nav>
    </header>

    <div class="main-container">
        <section class="slider-container" id="slider">
            <div class="slide-media" id="slide-media" hidden>
                <img id="slide-image" alt="Recuerdo especial de mamá">
            </div>
            <!-- Mensaje flotante animado -->
            <div class="message-banner">
                <p class="presentation-message" id="presentation-message"></p>
            </div>
        </section>
    </div>

    <!-- REPRODUCTOR DE MÚSICA OCULTO -->
    <audio id="bg-music" src="cancion.mp3" loop></audio>

    <script>
        let slides = [];
        let messages = [];
        let currentSlide = 0;
        let currentMessage = 0;
        let slideshowInterval = null;
        let messageInterval = null;

        async function loadContent() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                slides = data.slides || [];
                messages = data.messages || [];
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
            }
        }

        // Función que se ejecuta al hacer clic en la portada de bienvenida
        function iniciarExperiencia() {
            const overlay = document.getElementById('welcome-overlay');
            overlay.classList.add('fade-out');

            // Reproducir música de fondo
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Audio pausado por el navegador:", e));

            // Iniciar la presentación de fotos y mensajes
            iniciarPresentacion();
        }

        function iniciarPresentacion() {
            const mediaElem = document.getElementById('slide-media');
            const imageElem = document.getElementById('slide-image');
            const messageElem = document.getElementById('presentation-message');
            const sliderElem = document.getElementById('slider');

            function showSlide(index) {
                if (slides.length > 0) {
                    currentSlide = (index + slides.length) % slides.length;
                    const slide = slides[currentSlide];
                    const imgSrc = slide.image?.data || (typeof slide.image === 'string' ? slide.image : null);

                    if (imgSrc) {
                        imageElem.src = imgSrc;
                        mediaElem.hidden = false;
                        sliderElem.style.backgroundImage = `url("${imgSrc}")`;
                        sliderElem.classList.add('image-background-slide');
                    } else {
                        imageElem.removeAttribute('src');
                        mediaElem.hidden = true;
                        sliderElem.style.backgroundImage = '';
                        sliderElem.classList.remove('image-background-slide');
                    }
                }
            }

            function updateMessage() {
                if (messages.length > 0) {
                    messageElem.style.opacity = '0';
                    setTimeout(() => {
                        messageElem.textContent = messages[currentMessage];
                        messageElem.style.opacity = '1';
                        currentMessage = (currentMessage + 1) % messages.length;
                    }, 300);
                }
            }

            showSlide(currentSlide);
            updateMessage();

            if (slides.length > 1 && !slideshowInterval) {
                slideshowInterval = setInterval(() => {
                    currentSlide = (currentSlide + 1) % slides.length;
                    showSlide(currentSlide);
                }, 8000);
            }

            if (messages.length > 1 && !messageInterval) {
                messageInterval = setInterval(updateMessage, 4000);
            }
        }

        // Precargar los datos del servidor al cargar la página en segundo plano
        window.onload = loadContent;
    </script>
</body>
</html>
