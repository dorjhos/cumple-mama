<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Mamá! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="presentation-page">
    <header>
        <div class="logo">💐 Para la mejor Mamá</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="admin.html">Administración ⚙️</a>
        </nav>
    </header>

    <div class="main-container">
        <section class="slider-container" id="slider">
            <div class="slide-media" id="slide-media" hidden>
                <img id="slide-image" alt="Recuerdo especial de mamá">
            </div>
            <div class="slide-copy" id="slide-copy">
                <h2 class="slide-title" id="slide-title">Cargando del servidor...</h2>
                <p class="slide-desc" id="slide-desc"></p>
            </div>
            <div class="message-banner">
                <p class="presentation-message" id="presentation-message"></p>
            </div>
        </section>
    </div>

    <script>
        async function loadContent() {
            const SLIDE_INTERVAL_MS = 8000;
            const MESSAGE_INTERVAL_MS = 4000;

            let slides = [];
            let messages = [];

            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                slides = data.slides || [];
                messages = data.messages || [];
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
            }

            const mediaElem = document.getElementById('slide-media');
            const imageElem = document.getElementById('slide-image');
            const titleElem = document.getElementById('slide-title');
            const descElem = document.getElementById('slide-desc');
            const messageElem = document.getElementById('presentation-message');
            const sliderElem = document.getElementById('slider');

            let currentSlide = 0;
            let currentMessage = 0;

            function showSlide(index) {
                if (slides.length > 0) {
                    currentSlide = (index + slides.length) % slides.length;
                    const slide = slides[currentSlide];

                    titleElem.textContent = slide.title || "";
                    descElem.textContent = slide.description || "";

                    const imgSrc = slide.image?.data || (typeof slide.image === 'string' ? slide.image : null);

                    if (imgSrc) {
                        imageElem.src = imgSrc;
                        mediaElem.hidden = false;
                        sliderElem.style.backgroundImage = `url("${imgSrc}")`;
                        sliderElem.classList.add('image-background-slide');
                    } else {
                        imageElem.removeAttribute('src');
                        mediaElem.hidden = true;
                        sliderElem.style.backgroundImage = '';
                        sliderElem.classList.remove('image-background-slide');
                    }
                }
            }

            function updateMessage() {
                if (messages.length > 0) {
                    messageElem.style.opacity = '0';
                    setTimeout(() => {
                        messageElem.textContent = messages[currentMessage];
                        messageElem.style.opacity = '1';
                        currentMessage = (currentMessage + 1) % messages.length;
                    }, 300);
                }
            }

            showSlide(currentSlide);
            updateMessage();

            if (slides.length > 1) {
                setInterval(() => {
                    currentSlide = (currentSlide + 1) % slides.length;
                    showSlide(currentSlide);
                }, SLIDE_INTERVAL_MS);
            }

            if (messages.length > 1) {
                setInterval(updateMessage, MESSAGE_INTERVAL_MS);
            }
        }

        window.onload = loadContent;
    </script>
</body>
</html>

    </script>
</body>
</html>
